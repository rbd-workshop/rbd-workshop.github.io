<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{seoTitle}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{pageUrl}}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:site_name" content="{{title}} (RBD)">
  <meta property="og:title" content="{{seoTitle}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{pageUrl}}">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="{{socialImageUrl}}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}}: {{subtitle}}. Workshop at {{conference}} in {{location}}.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{seoTitle}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{socialImageUrl}}">
  <meta name="twitter:image:alt" content="{{title}}: {{subtitle}}. Workshop at {{conference}}.">
  <script type="application/ld+json">{{structuredData}}</script>
  <link rel="icon" type="image/svg+xml" href="{{siteRoot}}assets/favicon.svg">
  <link rel="apple-touch-icon" href="{{siteRoot}}assets/rbd-icon.png">
  <link rel="stylesheet" href="{{siteRoot}}assets/style.css?v={{styleVersion}}">
  {{heroPreload}}
  <script src="{{siteRoot}}assets/app.js?v={{scriptVersion}}" defer></script>
</head>
<body id="home" data-page="{{pageId}}">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner container">
      <a class="brand" href="{{siteRoot}}" aria-label="RBD workshop home" translate="no"><img src="{{siteRoot}}assets/rbd-mark.svg" width="200" height="76" alt="RBD"><span>2027</span></a>
      <nav id="main-nav" aria-label="Main navigation">{{navigation}}</nav>
    </div>
  </header>
  <main id="main" tabindex="-1">
{{legacyLinks}}
{{content}}
  </main>
  <footer class="site-footer">
    <div class="container"><p>© {{title}} (RBD) Workshop @ {{conference}}</p><div class="footer-links">{{footerContact}}<a href="#home">Back to top</a></div></div>
  </footer>
{{legacyRoutes}}
</body>
</html>
